# TAC_PSOC_82 of the upstream TAC config set.
#
# The upstream config also gives uim2 to 18. pytactl has always driven the
# last pin given a command, which is the one that keeps it here.

name = "SHIKRA PSOC"
description = "SHIKRA PSOC"
board_id = 82
extends = ["psoc", "common"]

[pins]
15 = "eud"
16 = "uim1"
18 = { initial = 0 }
29 = { initial = 0 }
38 = { initial = 0 }
39 = { initial = 0 }
46 = { initial = 0 }
48 = { initial = 0 }
49 = { initial = 0 }
