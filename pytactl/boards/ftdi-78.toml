# TAC_FTDI_78 of the upstream TAC config set.

name = "Maili CDP8950"
description = "ALPACA-LITE MAILI CDP"
usb_product = "ALPACA-LITE MAILI CDP"
extends = ["ftdi", "common", "common-no-usb1", "common-uefi-pkey-confirm"]

[pins]
C1 = "mode0"
C2 = "gg2"
C3 = "mode1"
C5 = "gg1"
C6 = "gg3"

[timings]
powerKeyPress = 3500
fastbootPress = 2000
fastboot = 6000

[functions]
# This board has no bootToSecondaryEDL.
bootToSecondaryEDL = false
