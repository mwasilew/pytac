# TAC_FTDI_28 of the upstream TAC config set.

name = "KUNO CDPS35"
description = "ALPACA-LITE CDPS35"
usb_product = "ALPACA-LITE CDPS35"
extends = ["ftdi", "common", "common-no-usb1"]

[pins]
C1 = "mode0"
C2 = "volup"
C3 = "mode1"
C4 = "bootconfig2"
C5 = "bootconfig0"
C6 = "m2poff"
C7 = "tcready"
D0 = "sedl"

[timings]
uefi = 15000
fastbootPress = 11000
fastboot = 3000
