# For boards that confirm the UEFI menu with the power key alone: replaces
# bootToUEFI of common.

[functions]
bootToUEFI = """
powerOffTheDevice
pkey 0
volup 1
voldn 0
pedl 0
powerOnTheDevice
delay $uefiPowerOnDelay // optional
pkey 1
delay $uefi
pkey 0
volup 0
delay $uefiRepeatDelay
pkey 1
pkey 0
volup 0
"""
